<script>
    const STORAGE_KEY = "kings_100days_diet_data";
    let currentChartFilter = '14'; // デフォルトは直近14日間表示

    function loadAppData() {
        const data = localStorage.getItem(STORAGE_KEY);
        if (!data) {
            return { startWeight: null, targetWeight: null, history: [] };
        }
        return JSON.parse(data);
    }

    function saveAppData(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function calc7DayAvg(history, endIndex) {
        const startIdx = Math.max(0, endIndex - 6);
        const slice = history.slice(startIdx, endIndex + 1);
        const sum = slice.reduce((acc, cur) => acc + cur.weight, 0);
        return sum / slice.length;
    }

    function recalculateAllStagnation(history) {
        history.sort((a, b) => new Date(a.date) - new Date(b.date));

        history.forEach((h, idx) => {
            h.day = idx + 1;
        });

        let prevN = 0;
        for (let i = 0; i < history.length; i++) {
            const Wavg = calc7DayAvg(history, i);
            const prevIdx = Math.max(0, i - 7);
            const Wprev = calc7DayAvg(history, prevIdx);

            const deltaW = Wavg - Wprev;
            const tolerance = Wprev * 0.003;

            let isWithinTolerance = Math.abs(deltaW) <= tolerance;
            let newN = prevN;

            if (isWithinTolerance) {
                newN = prevN + 1;
            } else if (deltaW < -tolerance) {
                newN = 0;
            }

            let status = "非停滞期";
            if (isWithinTolerance && newN >= 14) {
                status = "停滞期確定";
            } else if (isWithinTolerance && newN >= 5 && newN <= 13) {
                status = "停滞期の予兆";
            }

            history[i].nCount = newN;
            history[i].status = status;
            prevN = newN;
        }
    }

    function evaluateStagnation(history) {
        if (history.length === 0) {
            return { status: "非停滞期", periodCode: "normal", nCount: 0 };
        }
        recalculateAllStagnation(history);
        const last = history[history.length - 1];
        let periodCode = "normal";
        if (last.status === "停滞期確定") periodCode = "confirmed";
        else if (last.status === "停滞期の予兆") periodCode = "omen";

        return { status: last.status, periodCode, nCount: last.nCount };
    }

    function getChapterCode(day) {
        if (day === 1) return "1";
        if (day <= 20) return "2";
        if (day <= 70) return "3";
        if (day <= 99) return "4";
        return "5";
    }

    function getDayDiffCode(history, startWeight) {
        if (history.length < 2) return "flat";

        const currentW = history[history.length - 1].weight;
        const prevW = history[history.length - 2].weight;
        const diff = currentW - prevW;
        
        const baseWeight = startWeight || prevW;
        const diffPercent = (diff / baseWeight) * 100;

        if (diffPercent <= -0.6) return "large_decrease";
        if (diffPercent <= -0.2) return "small_decrease";
        if (diffPercent < 0.2) return "flat";
        if (diffPercent < 0.6) return "small_increase";
        return "large_increase";
    }

    function getConclusionCode(chapterCode, isGoalReached) {
        if (chapterCode === "1") return "1";
        if (chapterCode === "2") return "2";
        if (chapterCode === "3") return "3";
        if (chapterCode === "4") return "4";
        return isGoalReached ? "5A" : "5B";
    }

    function generateInitialChapterSpeech(day) {
        if (typeof MINISTER_DB === 'undefined' || !MINISTER_DB.chapters) {
            return "おはようございます、我が王。本日の玉座へのご登壇をお待ちしておりましたぞ！";
        }

        const chapterCode = getChapterCode(day);
        const matches = MINISTER_DB.chapters.filter(item => String(item.chapter) === String(chapterCode));
        if (!matches || matches.length === 0) {
            return "おはようございます、我が王。本日の玉座へのご登壇をお待ちしておりましたぞ！";
        }

        const idx = Math.floor(Math.random() * matches.length);
        let text = matches[idx].text;

        text = text.replace(/\{day\}/g, day)
                   .replace(/\{days\}/g, day)
                   .replace(/\{入力日数\}/g, day);

        return text;
    }

    function generateMinisterSpeech(history, startWeight, targetWeight, evalResult) {
        if (typeof MINISTER_DB === 'undefined') {
            return `📜 奏上：本日の体重【${history[history.length - 1].weight}kg】、しかと受け止めましたぞ！`;
        }

        const currentRecord = history[history.length - 1];
        const day = currentRecord.day;
        const chapterCode = getChapterCode(day);
        const dayDiffCode = getDayDiffCode(history, startWeight);
        const isGoalReached = currentRecord.weight <= targetWeight;
        const conclusionCode = getConclusionCode(chapterCode, isGoalReached);

        function getRandomText(list, filterKey, filterVal) {
            const matches = list.filter(item => String(item[filterKey]) === String(filterVal));
            if (!matches || matches.length === 0) return "";
            const idx = Math.floor(Math.random() * matches.length);
            return matches[idx].text;
        }

        let textDayDiff = getRandomText(MINISTER_DB.dayDiffs, "day_diff", dayDiffCode);
        let textPeriod = "";
        if (evalResult.periodCode === "omen" || evalResult.periodCode === "confirmed") {
            textPeriod = getRandomText(MINISTER_DB.periods, "period", evalResult.periodCode);
        }
        let textConclusion = getRandomText(MINISTER_DB.conclusions, "conclusion", conclusionCode);

        let fullText = [textDayDiff, textPeriod, textConclusion]
            .filter(t => t && t.trim() !== "")
            .join("\n\n");

        fullText = fullText.replace(/\{day\}/g, day)
                           .replace(/\{days\}/g, day)
                           .replace(/\{入力日数\}/g, day);

        return fullText;
    }

    function renderShieldUI(status) {
        const shieldNormal = document.getElementById("shieldNormal");
        const shieldCaution = document.getElementById("shieldCaution");
        const shieldDefense = document.getElementById("shieldDefense");

        shieldNormal.style.display = "none";
        shieldCaution.style.display = "none";
        shieldDefense.style.display = "none";

        if (status === "停滞期確定") {
            shieldDefense.style.display = "block";
        } else if (status === "停滞期の予兆") {
            shieldCaution.style.display = "block";
        } else {
            shieldNormal.style.display = "block";
        }
    }

    window.onload = function() {
        const appData = loadAppData();
        const currentDay = appData.history.length + 1;
        document.getElementById("dayCounter").innerText = `Day ${currentDay} / 100`;
        
        const initMsg = generateInitialChapterSpeech(currentDay);
        document.getElementById("messageArea").innerText = initMsg;

        const evalResult = evaluateStagnation(appData.history);
        renderShieldUI(evalResult.status);
    };

    function submitWeight() {
        const inputVal = parseFloat(document.getElementById("weightInput").value);
        if (isNaN(inputVal) || inputVal <= 0) {
            alert("有効な体重を入力してください、王よ。");
            return;
        }

        let appData = loadAppData();
        
        if (appData.history.length === 0) {
            appData.startWeight = inputVal;
            appData.targetWeight = Number((inputVal * 0.95).toFixed(1));
        }

        const todayStr = new Date().toISOString().split('T')[0];
        const newDayNumber = appData.history.length + 1;
        
        const tempRecord = {
            day: newDayNumber,
            date: todayStr,
            weight: inputVal,
            nCount: 0,
            status: "非停滞期"
        };
        appData.history.push(tempRecord);

        const evalResult = evaluateStagnation(appData.history);
        saveAppData(appData);

        document.getElementById("throneBanner").style.display = "none";
        document.getElementById("ministerImg").style.display = "block";
        
        document.getElementById("inputFormSection").style.display = "none";
        document.getElementById("resultSection").style.display = "block";
        document.getElementById("dayCounter").innerText = `Day ${newDayNumber} / 100`;
        renderShieldUI(evalResult.status);

        const speechMsg = generateMinisterSpeech(appData.history, appData.startWeight, appData.targetWeight, evalResult);
        document.getElementById("messageArea").innerText = speechMsg;

        renderChart(appData);
    }

    function resetToInput() {
        document.getElementById("weightInput").value = "";
        
        document.getElementById("throneBanner").style.display = "block";
        document.getElementById("ministerImg").style.display = "none";

        document.getElementById("resultSection").style.display = "none";
        document.getElementById("inputFormSection").style.display = "block";
        
        const appData = loadAppData();
        const nextDay = appData.history.length + 1;
        document.getElementById("dayCounter").innerText = `Day ${nextDay} / 100`;
        
        const initMsg = generateInitialChapterSpeech(nextDay);
        document.getElementById("messageArea").innerText = initMsg;
        
        const evalResult = evaluateStagnation(appData.history);
        renderShieldUI(evalResult.status);
    }

    /* --- 王国の書庫（バックアップ・インポート機能） --- */
    function exportBackupJson() {
        const data = localStorage.getItem(STORAGE_KEY);
        if (!data) {
            alert("我が王、まだ書き出すべき王国記録がございませんぞ！");
            return;
        }

        const blob = new Blob([data], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        
        const todayStr = new Date().toISOString().split('T')[0];
        a.href = url;
        a.download = `kings_100days_diet_backup_${todayStr}.json`;
        
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        alert("📜 王国記の写し（バックアップ）の書き出しに成功いたしましたぞ！");
    }

    function importBackupJson(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const jsonContent = e.target.result;
                const parsedData = JSON.parse(jsonContent);

                if (!parsedData.history || !Array.isArray(parsedData.history)) {
                    throw new Error("無効な王国データ構造です。");
                }

                if (confirm("⚠️ 既存の王国記録の上に、選択したファイルのデータを上書き（復元）します。本当によろしいですか？")) {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(parsedData));
                    alert("📥 王国データの復元が完了いたしました！最新の状態に切り替えます。");
                    window.location.reload();
                }
            } catch (err) {
                alert("❌ データの読み込みに失敗しました。正しいバックアップファイル（JSON）を選択してください。");
                console.error(err);
            }
        };
        reader.readAsText(file);
        event.target.value = "";
    }

    /* --- 二重確認付き完全リセット --- */
    function resetAllData() {
        if (confirm("⚠️【警告】これまでの王国記録をすべて消去し、初日（Day 1）からやり直しますか？\n（※大切な記録は事前に「記録を書き出す」で保存推奨です！）")) {
            if (confirm("本当に後悔ありませんね？ この操作は取り消せません。")) {
                localStorage.removeItem(STORAGE_KEY);
                alert("王国記録が完全にリセットされました。新たな気持ちで初日の測定を行ってくださいませ！");
                window.location.reload();
            }
        }
    }

    /* --- 日誌モーダル関連処理 --- */
    function openJournalModal() {
        document.getElementById("newRecordDate").value = new Date().toISOString().split('T')[0];
        document.getElementById("newRecordWeight").value = "";
        
        renderJournalList();
        document.getElementById("journalModal").style.display = "flex";
    }

    function closeJournalModal() {
        document.getElementById("journalModal").style.display = "none";
    }

    function renderJournalList() {
        const appData = loadAppData();
        const journalList = document.getElementById("journalList");
        journalList.innerHTML = "";

        if (appData.history.length === 0) {
            journalList.innerHTML = "<p style='font-size:0.85rem;'>まだ記された王国記録がございません。</p>";
        } else {
            appData.history.forEach((record, index) => {
                const row = document.createElement("div");
                row.className = "journal-row";
                row.innerHTML = `
                    <span>Day ${record.day} (${record.date || '日付不明'})</span>
                    <div>
                        <input type="number" step="0.1" id="journal_weight_${index}" value="${record.weight}"> kg
                        <button class="btn-delete-row" onclick="deleteJournalRecord(${index})">削除</button>
                    </div>
                `;
                journalList.appendChild(row);
            });
        }
    }

    function addJournalRecord() {
        const dateVal = document.getElementById("newRecordDate").value;
        const weightVal = parseFloat(document.getElementById("newRecordWeight").value);

        if (!dateVal) {
            alert("日付を選択してください。");
            return;
        }
        if (isNaN(weightVal) || weightVal <= 0) {
            alert("有効な体重を入力してください。");
            return;
        }

        let appData = loadAppData();
        
        const existingIdx = appData.history.findIndex(h => h.date === dateVal);
        if (existingIdx >= 0) {
            appData.history[existingIdx].weight = weightVal;
        } else {
            appData.history.push({
                day: 0,
                date: dateVal,
                weight: weightVal,
                nCount: 0,
                status: "非停滞期"
            });
        }

        recalculateAllStagnation(appData.history);
        
        if (appData.history.length > 0) {
            appData.startWeight = appData.history[0].weight;
            appData.targetWeight = Number((appData.startWeight * 0.95).toFixed(1));
        }

        saveAppData(appData);
        alert(`📜 ${dateVal} の記録を追記いたしました！`);
        
        renderJournalList();
    }

    function deleteJournalRecord(index) {
        if (confirm(`Day ${index + 1} の記録を削除しますか？`)) {
            let appData = loadAppData();
            appData.history.splice(index, 1);
            
            recalculateAllStagnation(appData.history);

            if (appData.history.length > 0) {
                appData.startWeight = appData.history[0].weight;
                appData.targetWeight = Number((appData.startWeight * 0.95).toFixed(1));
            } else {
                appData.startWeight = null;
                appData.targetWeight = null;
            }

            saveAppData(appData);
            renderJournalList();
        }
    }

    function saveJournalEdits() {
        let appData = loadAppData();
        let updated = false;

        appData.history.forEach((record, index) => {
            const inputElem = document.getElementById(`journal_weight_${index}`);
            if (inputElem) {
                const newVal = parseFloat(inputElem.value);
                if (!isNaN(newVal) && newVal > 0) {
                    record.weight = newVal;
                    updated = true;
                }
            }
        });

        if (updated) {
            recalculateAllStagnation(appData.history);
            if (appData.history.length > 0) {
                appData.startWeight = appData.history[0].weight;
                appData.targetWeight = Number((appData.startWeight * 0.95).toFixed(1));
            }
            saveAppData(appData);
            alert("📜 王国日誌の変更内容を反映いたしました！");
        }

        closeJournalModal();
        window.location.reload();
    }

    /* --- グラフ・ズーム関連処理 --- */
    function changeChartFilter(filterType, btnElement) {
        currentChartFilter = filterType;
        
        // ボタンのアクティブ状態を切り替え
        const tabs = document.querySelectorAll('.btn-chart-filter');
        tabs.forEach(tab => tab.classList.remove('active'));
        btnElement.classList.add('active');

        // グラフ再描画
        const appData = loadAppData();
        renderChart(appData);
    }

    let myChart = null;
    function renderChart(appData) {
        const ctx = document.getElementById('weightChart').getContext('2d');
        const fullHistory = appData.history;

        // 期間フィルターの適用
        let displayHistory = fullHistory;
        if (currentChartFilter !== 'all') {
            const limitDays = parseInt(currentChartFilter, 10);
            if (fullHistory.length > limitDays) {
                displayHistory = fullHistory.slice(fullHistory.length - limitDays);
            }
        }

        const labels = displayHistory.map(h => `Day ${h.day}`);
        const weights = displayHistory.map(h => h.weight);

        // 7日平均（全期間の履歴データをベースに計算、表示対象スライスを抽出）
        const movingAvgData = displayHistory.map((h) => {
            const fullIndex = fullHistory.findIndex(item => item.day === h.day);
            return Number(calc7DayAvg(fullHistory, fullIndex).toFixed(1));
        });

        const startW = appData.startWeight;
        const targetW = appData.targetWeight;
        const totalDays = 100;
        const dailyDecrease = (startW - targetW) / (totalDays - 1);
        const idealLineData = displayHistory.map(h => {
            let idealW = startW - dailyDecrease * (h.day - 1);
            return Number(idealW.toFixed(1));
        });

        if (myChart) myChart.destroy();

        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: '実績体重',
                        data: weights,
                        borderColor: '#722f37',
                        backgroundColor: 'rgba(114, 47, 55, 0.05)',
                        borderWidth: 2,
                        tension: 0.1,
                        fill: false
                    },
                    {
                        label: '直近7回平均',
                        data: movingAvgData,
                        borderColor: '#1a2b4c',
                        borderWidth: 2.5,
                        tension: 0.3,
                        fill: false
                    },
                    {
                        label: '理想ロード',
                        data: idealLineData,
                        borderColor: '#d4af37',
                        borderWidth: 2,
                        borderDash: [4, 4],
                        pointRadius: 0,
                        fill: false
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { 
                    y: { 
                        beginAtZero: false 
                    } 
                }
            }
        });
    }
</script>
